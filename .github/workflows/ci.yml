name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npx vite build

      - name: 冒烟测试 (jsdom, client/server 双模式)
        run: npm run smoke
